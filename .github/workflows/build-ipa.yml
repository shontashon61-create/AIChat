name: Build unsigned IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: xcodebuild -project AIChat.xcodeproj -target AIChat -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Make IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AIChat.app Payload/
          zip -r AIChat-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AIChat-unsigned-ipa
          path: AIChat-unsigned.ipa
